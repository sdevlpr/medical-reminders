<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Profiles - MedCare</title>

<link rel="stylesheet"
href="css/style.css">

<style>

.profile-form {
    max-width: 700px;
    margin: 0 auto 50px;
    background: white;
    padding: 35px;
    border: 1px solid #e2e8f0;
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(15,23,42,0.06);
}

.profile-form label {
    display: block;
    font-weight: 600;
    margin-top: 15px;
}

.profile-form input,
.profile-form select {
    width: 100%;
    padding: 13px;
    margin-top: 7px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
}

.profile-form button {
    margin-top: 22px;
    border: none;
    cursor: pointer;
}

.profile-list {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.profile-card {
    background: white;
    padding: 25px;
    border: 1px solid #e2e8f0;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(15,23,42,0.05);
}

.profile-avatar {
    width: 75px;
    height: 75px;
    border-radius: 50%;
    background: #eff6ff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    margin-bottom: 15px;
}

.profile-card h3 {
    margin-bottom: 8px;
}

.profile-card p {
    color: #64748b;
    margin: 5px 0;
}

.profile-actions {
    margin-top: 20px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.empty-profile {
    text-align: center;
    padding: 40px;
    color: #64748b;
}

@media(max-width:800px) {
    .profile-list {
        grid-template-columns: 1fr 1fr;
    }
}

@media(max-width:550px) {
    .profile-list {
        grid-template-columns: 1fr;
    }
}

</style>

</head>


<body>


<header class="header">

<div class="container nav">

<a href="index.html"
class="logo">

<span class="logo-icon">
💊
</span>

MedCare

</a>


<nav class="navigation">

<a href="index.html">
Home
</a>

<a href="dashboard.html">
Dashboard
</a>

<a href="profiles.html"
class="active">
Profiles
</a>

<a href="add-medicine.html">
Medicines
</a>

<a href="reminders.html">
Reminders
</a>

<a href="tracking.html">
Tracking
</a>

<a href="caregiver.html">
Caregiver
</a>

</nav>

</div>

</header>


<main>

<section class="features">

<div class="container">


<div class="section-heading">

<span class="section-label">
FAMILY PROFILES
</span>

<h2>
Kids & Elderly Profiles
</h2>

<p>
Create profiles to manage medicines and reminders.
</p>

</div>


<!-- ADD PROFILE FORM -->

<div class="profile-form">

<h2>
➕ Add New Profile
</h2>

<p style="color:#64748b;margin-top:5px;">
Add a child or elderly family member.
</p>


<form id="profile-form">


<label>
Profile Type *
</label>

<select
id="profile-type"
required>

<option value="">
Select Profile Type
</option>

<option value="Kid">
👦 Kid
</option>

<option value="Elderly">
👴 Elderly
</option>

</select>


<label>
Name *
</label>

<input
id="profile-name"
type="text"
placeholder="Enter full name"
required>


<label>
Age *
</label>

<input
id="profile-age"
type="number"
min="1"
max="120"
placeholder="Enter age"
required>


<label>
Gender
</label>

<select id="profile-gender">

<option value="">
Select Gender
</option>

<option value="Male">
Male
</option>

<option value="Female">
Female
</option>

<option value="Other">
Other
</option>

</select>


<label>
Caregiver Name
</label>

<input
id="caregiver-name"
type="text"
placeholder="Caregiver name">


<label>
Caregiver Mobile
</label>

<input
id="caregiver-mobile"
type="tel"
placeholder="10 digit mobile number">


<button
type="submit"
class="btn btn-primary">

💾 Save Profile

</button>


</form>

</div>


<!-- PROFILE LIST -->

<h2 style="margin-bottom:20px;">
Saved Profiles
</h2>


<div
id="profile-list"
class="profile-list">

</div>


</div>

</section>

</main>


<footer class="footer">

<div class="footer-bottom">

© 2026 MedCare.
Medical Reminder System.

</div>

</footer>


<script src="js/app.js"></script>


<script>

/* =====================================
   PROFILE SYSTEM
===================================== */

const PROFILE_KEY =
"medcare_profiles";


function getProfiles() {

    return JSON.parse(
        localStorage.getItem(PROFILE_KEY)
        || "[]"
    );

}


function saveProfiles(profiles) {

    localStorage.setItem(
        PROFILE_KEY,
        JSON.stringify(profiles)
    );

}


/* =====================================
   ADD PROFILE
===================================== */

const profileForm =
document.getElementById(
    "profile-form"
);


profileForm.addEventListener(
"submit",
function(event) {

    event.preventDefault();


    const type =
    document.getElementById(
        "profile-type"
    ).value;


    const name =
    document.getElementById(
        "profile-name"
    ).value.trim();


    const age =
    document.getElementById(
        "profile-age"
    ).value;


    const gender =
    document.getElementById(
        "profile-gender"
    ).value;


    const caregiver =
    document.getElementById(
        "caregiver-name"
    ).value.trim();


    const mobile =
    document.getElementById(
        "caregiver-mobile"
    ).value.trim();


    if (!type || !name || !age) {

        alert(
            "Please fill all required fields."
        );

        return;

    }


    const profiles =
    getProfiles();


    const profile = {

        id:
        Date.now().toString(),

        type:
        type,

        name:
        name,

        age:
        age,

        gender:
        gender,

        caregiver:
        caregiver,

        mobile:
        mobile,

        createdAt:
        new Date().toISOString()

    };


    profiles.push(profile);


    saveProfiles(profiles);


    alert(
        "✅ Profile added successfully!"
    );


    profileForm.reset();


    renderProfiles();

});


/* =====================================
   DISPLAY PROFILES
===================================== */

function renderProfiles() {

    const container =
    document.getElementById(
        "profile-list"
    );


    const profiles =
    getProfiles();


    if (profiles.length === 0) {

        container.innerHTML = `

        <div class="empty-profile">

            <div style="font-size:50px;">
                👥
            </div>

            <h3>
                No Profiles Added
            </h3>

            <p>
                Add a Kid or Elderly profile above.
            </p>

        </div>

        `;

        return;

    }


    container.innerHTML =
    profiles.map(
    profile => `

        <div class="profile-card">

            <div class="profile-avatar">

                ${
                    profile.type === "Kid"
                    ? "👦"
                    : "👴"
                }

            </div>


            <h3>
                ${profile.name}
            </h3>


            <p>
                <strong>
                    Type:
                </strong>

                ${profile.type}
            </p>


            <p>
                <strong>
                    Age:
                </strong>

                ${profile.age}
            </p>


            <p>
                <strong>
                    Gender:
                </strong>

                ${profile.gender || "Not specified"}
            </p>


            <p>
                <strong>
                    Caregiver:
                </strong>

                ${profile.caregiver || "Not added"}
            </p>


            <p>
                <strong>
                    Mobile:
                </strong>

                ${profile.mobile || "Not added"}
            </p>


            <div class="profile-actions">

                <button
                class="btn btn-secondary"
                onclick="editProfile('${profile.id}')">

                    ✏️ Edit

                </button>


                <button
                class="btn btn-secondary"
                onclick="deleteProfile('${profile.id}')">

                    🗑️ Delete

                </button>

            </div>

        </div>

    `
    ).join("");

}


/* =====================================
   EDIT PROFILE
===================================== */

function editProfile(id) {

    const profiles =
    getProfiles();


    const profile =
    profiles.find(
        item =>
        item.id === id
    );


    if (!profile) return;


    const name =
    prompt(
        "Enter profile name:",
        profile.name
    );


    if (!name) return;


    const age =
    prompt(
        "Enter age:",
        profile.age
    );


    if (!age) return;


    const caregiver =
    prompt(
        "Enter caregiver name:",
        profile.caregiver || ""
    );


    const mobile =
    prompt(
        "Enter caregiver mobile:",
        profile.mobile || ""
    );


    profile.name =
    name;

    profile.age =
    age;

    profile.caregiver =
    caregiver;

    profile.mobile =
    mobile;


    saveProfiles(profiles);


    renderProfiles();


    alert(
        "✅ Profile updated successfully!"
    );

}


/* =====================================
   DELETE PROFILE
===================================== */

function deleteProfile(id) {

    const confirmDelete =
    confirm(
        "Are you sure you want to delete this profile?"
    );


    if (!confirmDelete) return;


    let profiles =
    getProfiles();


    profiles =
    profiles.filter(
        profile =>
        profile.id !== id
    );


    saveProfiles(profiles);


    renderProfiles();


    alert(
        "Profile deleted successfully."
    );

}


/* =====================================
   INITIAL LOAD
===================================== */

renderProfiles();

</script>

</body>

</html>
