<main>

<section class="features">

<div class="container">


<div class="section-heading">

<span class="section-label">
MEDICINE MANAGEMENT
</span>

<h2>
Add New Medicine
</h2>

<p>
Enter medicine details and create a reminder.
</p>

</div>


<div
style="
max-width:700px;
margin:auto;
background:white;
padding:35px;
border:1px solid #e2e8f0;
border-radius:20px;
box-shadow:0 15px 40px rgba(15,23,42,0.06);
">


<form id="medicine-form">


<label>
Profile *
</label>

<select
id="profile"
required
style="
width:100%;
padding:14px;
margin:8px 0 20px;
border:1px solid #e2e8f0;
border-radius:8px;
">

<option value="">
Select Profile
</option>

<option value="Kid">
👦 Kid
</option>

<option value="Elderly">
👴 Elderly
</option>

</select>


<label>
Medicine Name *
</label>

<input
id="medicine-name"
type="text"
placeholder="Example: Paracetamol"
required
style="
width:100%;
padding:14px;
margin:8px 0 20px;
border:1px solid #e2e8f0;
border-radius:8px;
">


<label>
Dosage *
</label>

<input
id="dosage"
type="text"
placeholder="Example: 1 Tablet"
required
style="
width:100%;
padding:14px;
margin:8px 0 20px;
border:1px solid #e2e8f0;
border-radius:8px;
">


<label>
Medicine Date *
</label>

<input
id="medicine-date"
type="date"
required
style="
width:100%;
padding:14px;
margin:8px 0 20px;
border:1px solid #e2e8f0;
border-radius:8px;
">


<label>
Reminder Time *
</label>

<input
id="medicine-time"
type="time"
required
style="
width:100%;
padding:14px;
margin:8px 0 20px;
border:1px solid #e2e8f0;
border-radius:8px;
">


<label>
Food Instruction
</label>

<select
id="food"
style="
width:100%;
padding:14px;
margin:8px 0 20px;
border:1px solid #e2e8f0;
border-radius:8px;
">

<option>
Before Food
</option>

<option>
After Food
</option>

<option>
With Food
</option>

<option>
Any Time
</option>

</select>


<label>
Instructions
</label>

<textarea
id="instructions"
placeholder="Example: Give with water"
style="
width:100%;
height:110px;
padding:14px;
margin:8px 0 20px;
border:1px solid #e2e8f0;
border-radius:8px;
resize:vertical;
"></textarea>


<button
type="submit"
class="btn btn-primary"
style="
border:none;
cursor:pointer;
width:100%;
font-size:16px;
">

🔔 Save Medicine & Set Reminder

</button>


</form>

</div>

</div>

</section>

</main>


<footer class="footer">

<div class="footer-bottom">
