<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Medicine - MedCare</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header">

<div class="container nav">

<a href="index.html" class="logo">
    <span class="logo-icon">💊</span>
    MedCare
</a>

<nav class="navigation">

<a href="index.html">Home</a>
<a href="dashboard.html">Dashboard</a>
<a href="profiles.html">Profiles</a>
<a href="add-medicine.html" class="active">Medicines</a>
<a href="caregiver.html">Caregiver</a>

</nav>

</div>

</header>


<main>

<section class="features">

<div class="container">

<div class="section-heading">

<span class="section-label">
MEDICINE MANAGEMENT
</span>

<h2>Add Medicine</h2>

<p>
Create a medicine schedule and reminder.
</p>

</div>


<div style="
max-width:700px;
margin:auto;
background:white;
padding:35px;
border:1px solid #e2e8f0;
border-radius:20px;
">


<form>

<label>Profile</label>

<select style="width:100%;padding:14px;margin:8px 0 20px;">
<option>Select Profile</option>
<option>Kid</option>
<option>Elderly</option>
</select>


<label>Medicine Name</label>

<input
type="text"
placeholder="Enter medicine name"
style="width:100%;padding:14px;margin:8px 0 20px;border:1px solid #e2e8f0;border-radius:8px;"
>


<label>Dosage</label>

<input
type="text"
placeholder="Example: 1 Tablet"
style="width:100%;padding:14px;margin:8px 0 20px;border:1px solid #e2e8f0;border-radius:8px;"
>


<label>Reminder Time</label>

<input
type="time"
style="width:100%;padding:14px;margin:8px 0 20px;border:1px solid #e2e8f0;border-radius:8px;"
>


<label>Food Instruction</label>

<select style="width:100%;padding:14px;margin:8px 0 20px;">
<option>Before Food</option>
<option>After Food</option>
<option>With Food</option>
<option>Any Time</option>
</select>


<label>Instructions</label>

<textarea
placeholder="Additional instructions"
style="width:100%;height:100px;padding:14px;margin:8px 0 20px;border:1px solid #e2e8f0;border-radius:8px;"
></textarea>


<button
type="button"
class="btn btn-primary">
Save Medicine
</button>

</form>

</div>

</div>

</section>

</main>


<footer class="footer">

<div class="footer-bottom">
© 2026 MedCare.
</div>

</footer>

<script src="js/app.js"></script>

</body>
</html>
