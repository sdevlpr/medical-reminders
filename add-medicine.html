<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Medicine - MedCare</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header">
    <div class="container nav">

        <div class="logo">
            💊 MedCare
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="profiles.html">Profiles</a>
            <a href="add-medicine.html" class="active">Add Medicine</a>
            <a href="reminders.html">Reminders</a>
            <a href="tracking.html">Tracking</a>
            <a href="caregiver.html">Caregiver</a>
        </nav>

    </div>
</header>


<section class="section">

    <div class="container">

        <div class="section-title">

            <h1>➕ Add Medicine</h1>

            <p>
                Create a medicine reminder for your Kid or Elderly profile.
            </p>

        </div>


        <div class="card">

            <form id="medicine-form">

                <!-- PROFILE -->
                <div class="form-group">

                    <label for="profile">
                        👤 Select Profile
                    </label>

                    <select id="profile" required>

                        <option value="">
                            Loading Profiles...
                        </option>

                    </select>

                    <small>
                        First create a Kid or Elderly profile from the Profiles page.
                    </small>

                </div>


                <!-- MEDICINE NAME -->
                <div class="form-group">

                    <label for="medicine-name">
                        💊 Medicine Name
                    </label>

                    <input
                        type="text"
                        id="medicine-name"
                        placeholder="Example: Paracetamol"
                        required
                    >

                </div>


                <!-- DOSAGE -->
                <div class="form-group">

                    <label for="dosage">
                        💧 Dosage
                    </label>

                    <input
                        type="text"
                        id="dosage"
                        placeholder="Example: 1 Tablet"
                        required
                    >

                </div>


                <!-- DATE -->
                <div class="form-group">

                    <label for="medicine-date">
                        📅 Date
                    </label>

                    <input
                        type="date"
                        id="medicine-date"
                        required
                    >

                </div>


                <!-- TIME -->
                <div class="form-group">

                    <label for="medicine-time">
                        ⏰ Reminder Time
                    </label>

                    <input
                        type="time"
                        id="medicine-time"
                        required
                    >

                </div>


                <!-- FOOD -->
                <div class="form-group">

                    <label for="food">
                        🍽️ Food Instruction
                    </label>

                    <select id="food">

                        <option value="Anytime">
                            Anytime
                        </option>

                        <option value="Before Food">
                            Before Food
                        </option>

                        <option value="After Food">
                            After Food
                        </option>

                        <option value="With Food">
                            With Food
                        </option>

                    </select>

                </div>


                <!-- INSTRUCTIONS -->
                <div class="form-group">

                    <label for="instructions">
                        📝 Instructions
                    </label>

                    <textarea
                        id="instructions"
                        rows="4"
                        placeholder="Example: Take with one glass of water."
                    ></textarea>

                </div>


                <!-- BUTTON -->
                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    🔔 Save Medicine & Set Reminder
                </button>

            </form>

        </div>

    </div>

</section>


<footer class="footer">

    <div class="container">

        <p>
            © 2026 MedCare - Medical Reminder System
        </p>

    </div>

</footer>


<script src="js/app.js"></script>


<script>

/* =========================================
   LOAD CREATED PROFILES
========================================= */

function loadProfiles() {

    const profileSelect =
        document.getElementById("profile");

    if (!profileSelect) return;


    let profiles = [];

    try {

        profiles = JSON.parse(
            localStorage.getItem("medcare_profiles") || "[]"
        );

    } catch (error) {

        console.error(
            "Profile loading error:",
            error
        );

        profiles = [];

    }


    /* Clear dropdown */

    profileSelect.innerHTML = "";


    /* No profiles */

    if (
        !Array.isArray(profiles) ||
        profiles.length === 0
    ) {

        profileSelect.innerHTML = `
            <option value="">
                No Profile Found - Create Profile First
            </option>
        `;

        return;
    }


    /* Default option */

    profileSelect.innerHTML = `
        <option value="">
            Select Profile
        </option>
    `;


    /* Add profiles */

    profiles.forEach(function(profile) {

        const option =
            document.createElement("option");


        option.value =
            profile.id || profile.name;


        let icon = "👤";

        if (profile.type === "Kid") {

            icon = "👦";

        } else if (profile.type === "Elderly") {

            icon = "👴";

        }


        option.textContent =
            `${icon} ${profile.name} - ${profile.type} (${profile.age})`;


        profileSelect.appendChild(option);

    });


    console.log(
        "Profiles loaded:",
        profiles
    );
}


/* =========================================
   RUN AFTER PAGE LOAD
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadProfiles();

    }
);

</script>

</body>
</html>
